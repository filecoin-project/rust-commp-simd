[package]
name    = "rust-commp-simd"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
sha2 = { version = "0.10", default-features = false, features = ["compress"] }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
hex    = "0.4"
base32 = "0.4"

[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
sha2 = "0.10"
hex = "0.4"